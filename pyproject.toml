[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "food-vision"
version = "0.1.0"
description = "Food recognition with nutritional insights: CNN vs ViT vs zero-shot CLIP on Food-101, served with ONNX Runtime + FastAPI."
requires-python = ">=3.10"
license = { text = "AGPL-3.0-only" }
# Core install = torch-free serving (what the Docker image uses). Extras add the rest.
dependencies = [
    "numpy>=1.26",
    "pillow>=10.4",
    "onnxruntime>=1.20",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
train = [
    "torch>=2.9",
    "torchvision>=0.24",
    "timm>=1.0",
    "open_clip_torch>=3.0",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "tqdm>=4.66",
    "tabulate>=0.9",
    "onnx>=1.17",
    "onnxscript>=0.2",
]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.8"]

[project.urls]
Repository = "https://github.com/samadarsh/food-vision"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
food_vision = ["resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "B", "UP"]
ignore = [
    "B008",  # FastAPI's File(...) / Query(...) defaults are the documented idiom
    "B905",  # zip() without strict=: lengths are equal by construction here
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["B023"]  # closures defined in a loop are called within the same iteration
