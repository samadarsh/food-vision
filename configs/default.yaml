# food-vision configuration: the single place to change classes and subset sizes.
# Relative paths are resolved against the current working directory (run from repo root).

seed: 42

data:
  root: data                 # Food-101 is downloaded to <root>/food-101 (~5 GB)
  splits_dir: data/splits    # CSV manifests of the sampled subset
  reports_dir: reports       # EDA / evaluation outputs

  # Any subset of the 101 Food-101 class names (validated against meta/classes.txt).
  # Labels are assigned in sorted order, so the order here does not matter.
  classes:
    # Indian / South-Asian relevant
    - samosa
    - chicken_curry
    - fried_rice
    - dumplings          # visually close to momos
    - omelette
    - spring_rolls
    # Common dishes
    - pizza
    - hamburger
    - french_fries
    - sushi
    - ramen
    - caesar_salad
    - pancakes
    - waffles
    - donuts
    # Deliberately confusable pairs (useful for error analysis)
    - steak
    - filet_mignon
    - ice_cream
    - frozen_yogurt
    - chocolate_cake

  # Images per class. train+val are drawn (disjointly) from the official Food-101
  # train split (750/class); test from the official test split (250/class).
  # null = take everything available (for val: 10% of the official train images).
  train_per_class: 300
  val_per_class: 75
  test_per_class: 100

  # Images removed from every split (Food-101 ids, no extension). Found by scripts/eda.py:
  exclude:
    - omelette/2619753     # byte-identical to pancakes/2619752; photo shows both dishes
    - pancakes/2619752
    - dumplings/180290     # byte-identical to dumplings/167000 (train/val leak)

  image_size: 224
  batch_size: 32
  num_workers: 4

# --------------------------------------------------------------------------- Phase 2
train:
  epochs: 15
  warmup_epochs: 1
  label_smoothing: 0.1
  grad_clip: 1.0
  patience: 4              # early stopping on val top-1
  amp: true                # fp16 autocast + GradScaler on MPS/CUDA; off on CPU
  device: auto             # auto = mps -> cuda -> cpu
  runs_dir: runs           # runs/<model>/{metrics.csv, best.pt, test_metrics.json, ...}

models:
  cnn:
    arch: efficientnet_b0  # torchvision: efficientnet_b0 | resnet50
    lr: 1.0e-3
    weight_decay: 0.01
  vit:
    # timm name. Larger alternative (better on a CUDA GPU / Colab):
    #   vit_base_patch16_224.augreg2_in21k_ft_in1k
    arch: vit_small_patch16_224.augreg_in21k_ft_in1k
    lr: 1.0e-4
    weight_decay: 0.05
  clip:                    # zero-shot, no training
    arch: ViT-B-32
    pretrained: laion2b_s34b_b79k
    templates:             # text embeddings are averaged over these prompts
      - "a photo of {}, a type of food."
      - "a close-up photo of {}, a dish."
      - "a photo of a plate of {}."
      - "{}, served at a restaurant."
